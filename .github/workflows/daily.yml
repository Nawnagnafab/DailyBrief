name: Daily Brief

# Generate a fresh daily report and publish to GitHub Pages.
#
# One-time setup for forkers (see README → "Run on GitHub Actions"):
#   1. Settings → Actions → General → enable workflows (forked repos start disabled)
#   2. Settings → Pages → Build & deployment → Source: "Deploy from a branch" → gh-pages / root
#   3. Settings → Secrets and variables → Actions:
#        - Secrets: ANTHROPIC_API_KEY (or OPENAI / DEEPSEEK / MINIMAX / ZHIPU as you prefer)
#        - Variables (all optional, sensible defaults provided):
#            LLM_BACKEND     anthropic | openai | deepseek | minimax | zhipu    (default: anthropic)
#            LLM_MODEL       e.g. claude-sonnet-4-6 / gpt-4o-mini       (backend default if unset)
#            REPORT_LOCALE   zh | en                                    (default: zh)
#            REPORT_TZ       IANA tz, e.g. Asia/Shanghai / UTC          (default: UTC in CI)
#            REPORT_HOUR     trigger hour(s) in REPORT_TZ, comma-list   (default: 8 — 08:00)
#                            examples: "8" / "8,18" / "0,6,12,18"
#            REPORT_DAYS     day-of-week filter (cron-style 0-6 SUN=0)  (default: * — every day)
#                            examples: "*" / "1-5" (weekdays) / "1,3,5" (MWF)
#   4. Trigger once manually from Actions tab to seed gh-pages.
#
# After first successful run your report is live at:
#   https://<your-username>.github.io/<repo-name>/
#
# Schedule mechanics: cron probes twice per hour because GitHub Actions cron is
# UTC-only and we want the user's local-timezone hour. The gate assigns each
# probe to the latest configured hour, checks prior successful scheduled runs
# in that slot, and runs only when the slot is still unsatisfied. This provides
# catch-up after dropped cron events without sending duplicate reports.
# workflow_dispatch always bypasses the gate.

on:
  schedule:
    # Two hourly triggers (at :07 and :37) — GitHub Actions silently drops
    # a non-trivial fraction of scheduled runs, sometimes whole stretches
    # of 2-3 hours back-to-back. A single off-peak cron was not enough; we
    # saw the BJ 08-10 stretch get fully swallowed multiple times. Two
    # triggers per hour gives ~95% per-window coverage, and the gate retries
    # later probes until each configured delivery slot has one successful run.
    - cron: '7 * * * *'
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write  # needed to push to gh-pages branch

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  gate:
    name: Time gate
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Check schedule
        id: check
        env:
          REPORT_TZ: ${{ vars.REPORT_TZ }}
          REPORT_HOUR: ${{ vars.REPORT_HOUR }}
          REPORT_DAYS: ${{ vars.REPORT_DAYS }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Manual triggers always run — user clicked Run workflow.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual trigger — bypassing time gate"
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TZ_VAL="${REPORT_TZ:-UTC}"
          HOURS_VAL="${REPORT_HOUR:-8}"
          DAYS_VAL="${REPORT_DAYS:-*}"

          NOW_HOUR=$(TZ="$TZ_VAL" date +%-H)
          NOW_DOW=$(TZ="$TZ_VAL" date +%w)
          NOW_PRINT=$(TZ="$TZ_VAL" date '+%Y-%m-%d %H:%M %Z')

          echo "Now in $TZ_VAL: $NOW_PRINT (hour=$NOW_HOUR, dow=$NOW_DOW)"
          echo "Configured REPORT_HOUR='$HOURS_VAL', REPORT_DAYS='$DAYS_VAL'"

          # Parse, validate, and sort the configured delivery hours.
          IFS=',' read -ra HLIST <<< "$HOURS_VAL"
          NORMALIZED_HOURS=()
          for h in "${HLIST[@]}"; do
            h_trim="${h// /}"
            if ! [[ "$h_trim" =~ ^([0-9]|1[0-9]|2[0-3])$ ]]; then
              echo "Invalid REPORT_HOUR entry: '$h_trim' (expected 0-23)" >&2
              exit 1
            fi
            NORMALIZED_HOURS+=("$((10#$h_trim))")
          done
          mapfile -t SORTED_HOURS < <(
            printf '%s\n' "${NORMALIZED_HOURS[@]}" | sort -n -u
          )

          # Day-of-week match: '*', single digits, ranges "a-b", or comma combos.
          day_match=false
          if [ "$DAYS_VAL" = "*" ]; then
            day_match=true
          else
            IFS=',' read -ra DLIST <<< "$DAYS_VAL"
            for d in "${DLIST[@]}"; do
              d_trim="${d// /}"
              if [[ "$d_trim" == *-* ]]; then
                start="${d_trim%-*}"
                end="${d_trim#*-}"
                if [ "$NOW_DOW" -ge "$start" ] && [ "$NOW_DOW" -le "$end" ]; then
                  day_match=true
                  break
                fi
              else
                if [ "$NOW_DOW" = "$d_trim" ]; then
                  day_match=true
                  break
                fi
              fi
            done
          fi

          if [ "$day_match" != "true" ]; then
            echo "✗ Day filter does not match — skipping"
            echo "should-run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Assign this probe to the latest delivery hour that is due today.
          # The following configured hour is the exclusive end of the slot.
          due_hour=-1
          next_hour=24
          for h in "${SORTED_HOURS[@]}"; do
            if [ "$NOW_HOUR" -ge "$h" ]; then
              due_hour=$h
            elif [ "$due_hour" -ge 0 ]; then
              next_hour=$h
              break
            fi
          done

          if [ "$due_hour" -lt 0 ]; then
            echo "✗ No delivery slot is due yet — skipping"
            echo "should-run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TODAY=$(TZ="$TZ_VAL" date +%Y-%m-%d)
          echo "Current delivery slot: $TODAY hour $due_hour (ends before $next_hour)"

          # A successful scheduled workflow in this local-time slot means the
          # report was already built, published, and emailed. Manual test runs
          # are intentionally excluded so they never suppress scheduled mail.
          prior_success=false
          RUN_TIMES=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/daily.yml/runs?event=schedule&status=success&per_page=100" \
            --jq '.workflow_runs[].run_started_at' 2>/dev/null || true)
          while IFS= read -r started_at; do
            [ -n "$started_at" ] || continue
            run_date=$(TZ="$TZ_VAL" date -d "$started_at" +%Y-%m-%d)
            run_hour_raw=$(TZ="$TZ_VAL" date -d "$started_at" +%-H)
            run_hour=$((10#$run_hour_raw))
            if [ "$run_date" = "$TODAY" ] \
              && [ "$run_hour" -ge "$due_hour" ] \
              && [ "$run_hour" -lt "$next_hour" ]; then
              echo "✓ Slot already satisfied by scheduled run started at $started_at"
              prior_success=true
              break
            fi
          done <<< "$RUN_TIMES"

          if [ "$prior_success" = "true" ]; then
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          else
            echo "✓ Slot is unsatisfied — proceeding to build"
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build & publish
    needs: gate
    if: needs.gate.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Bring previous reports into the workspace so they survive each run
      # and so build-site can list them all in the archive.
      - name: Restore existing reports from gh-pages
        run: |
          mkdir -p daily_reports
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git --work-tree=daily_reports checkout origin/gh-pages -- . || true
            # Drop the index/archive — build-site regenerates them
            rm -f daily_reports/index.html daily_reports/archive.html
            echo "Restored $(ls -1d daily_reports/20*/ 2>/dev/null | wc -l) prior report dirs"
          else
            echo "gh-pages doesn't exist yet — first run"
          fi

      - name: Generate today's report
        env:
          LLM_BACKEND: ${{ vars.LLM_BACKEND || 'anthropic' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          # Optional proxy / self-hosted endpoints — forward whatever the
          # forker set in Settings → Variables. Empty values are a no-op
          # (backends fall back to the official URL in code).
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          MINIMAX_BASE_URL: ${{ vars.MINIMAX_BASE_URL }}
          ZHIPU_BASE_URL: ${{ vars.ZHIPU_BASE_URL }}
          # Generic aliases — handy when pointing at an OpenAI/Anthropic
          # compatible service that isn't one of the named presets (Moonshot,
          # SiliconFlow, OpenRouter, self-hosted, ...). Provider-specific
          # vars above take precedence when both are set.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          REPORT_LOCALE: ${{ vars.REPORT_LOCALE || 'zh' }}
          REPORT_TZ: ${{ vars.REPORT_TZ }}
          WEB_MODE: 'true'
        run: npm run daily

      - name: Build static site (index + archive)
        run: npm run build-site

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./daily_reports
          publish_branch: gh-pages
          keep_files: false  # we restored everything above, so a clean publish is fine
          commit_message: 'daily: report for ${{ github.run_id }}'

      - name: Email report via 163 SMTP
        env:
          SMTP_HOST: smtp.163.com
          SMTP_PORT: '465'
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          REPORT_TZ: ${{ vars.REPORT_TZ || 'UTC' }}
        run: |
          python3 - <<'PY'
          import os
          import smtplib
          import ssl
          from datetime import datetime
          from email.message import EmailMessage
          from email.utils import formataddr
          from pathlib import Path
          from zoneinfo import ZoneInfo

          required = ("SMTP_USERNAME", "SMTP_AUTH_CODE", "EMAIL_TO")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              print(
                  f"::warning::Email delivery skipped; missing secrets: "
                  f"{', '.join(missing)}"
              )
              raise SystemExit(0)

          timezone = ZoneInfo(os.environ.get("REPORT_TZ", "UTC"))
          now = datetime.now(timezone)
          date_key = now.strftime("%Y-%m-%d")
          report_path = Path("daily_reports") / date_key / f"{date_key}.html"
          if not report_path.is_file():
              raise SystemExit(f"Generated report not found: {report_path}")

          username = os.environ["SMTP_USERNAME"]
          recipient = os.environ["EMAIL_TO"]
          repository = os.environ.get("GITHUB_REPOSITORY", "")
          owner, _, repo_name = repository.partition("/")
          pages_url = (
              f"https://{owner.lower()}.github.io/{repo_name}/"
              if owner and repo_name
              else ""
          )

          message = EmailMessage()
          message["Subject"] = f"Daily Brief | {date_key} {now.strftime('%H:%M')}"
          message["From"] = formataddr(("Daily Brief", username))
          message["To"] = recipient
          message.set_content(
              f"Daily Brief has been generated.\n\n"
              f"Online version: {pages_url or 'Unavailable'}\n"
          )
          message.add_alternative(
              report_path.read_text(encoding="utf-8"),
              subtype="html",
          )

          context = ssl.create_default_context()
          with smtplib.SMTP_SSL(
              os.environ.get("SMTP_HOST", "smtp.163.com"),
              int(os.environ.get("SMTP_PORT", "465")),
              context=context,
              timeout=30,
          ) as smtp:
              smtp.login(username, os.environ["SMTP_AUTH_CODE"])
              smtp.send_message(message)

          print("Email sent to the configured recipient")
          PY
